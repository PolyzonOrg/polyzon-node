version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8 supports typescript <6.1.0; lift once it supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
